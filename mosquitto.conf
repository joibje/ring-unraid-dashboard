# ==============================================
# Mosquitto MQTT Broker Config
# ==============================================
# This is the config for the MQTT message broker.
# MQTT is the glue between ring-mqtt and our snapshot saver.
# You probably don't need to change anything here.
# ==============================================

# listen on port 1883 (the standard MQTT port)
listener 1883

# allow connections without a username/password
# this is fine because it's only accessible inside your local network
# if you expose port 1883 to the internet, add authentication!
allow_anonymous true

# save messages to disk so they survive restarts
persistence true
persistence_location /mosquitto/data/

# log to a file so you can debug issues
log_dest file /mosquitto/log/mosquitto.log
